name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prisma migrations
        run: pnpm db:migrate:deploy

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Next.js app to Vercel
        run: pnpm dlx vercel@latest deploy --prod --token "$VERCEL_TOKEN"

  sync-inngest:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - name: Synchronize deployed Inngest functions
        run: >-
          pnpm dlx inngest-cli@latest deploy
          --url "$APP_URL/api/inngest"
          --key "$INNGEST_EVENT_KEY"
